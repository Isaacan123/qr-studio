<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QR Studio">
<meta name="description" content="Crea códigos QR personalizados con menú de enlaces, logo y diseño propio.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;600;700&family=Bricolage+Grotesque:wght@500;800&family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@500;700&family=Great+Vibes&display=swap">
<title>QR Studio</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f7f7f8;--card:#fff;--line:#e5e5e8;--tx:#111;--mut:#6b6b73;--pri:#0a66d0;--ok:#15803d;--bad:#b91c1c}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:15px;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--tx)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:#93c5fd}
input[type=color]{padding:3px;height:42px;width:56px;flex:none}
input[type=checkbox]{width:auto}
input[type=range]{padding:0;border:0;accent-color:#111}
.top{padding-top:max(12px,env(safe-area-inset-top))!important;display:flex;align-items:center;gap:18px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.marca{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.marca i{display:inline-block;width:22px;height:22px;border-radius:6px;background:#111}
.nav{display:flex;gap:6px;margin-left:auto}
.nav button{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--mut)}
.nav button.on{background:#111;color:#fff}
main{max-width:1240px;margin:0 auto;padding:22px;padding-bottom:max(22px,env(safe-area-inset-bottom))}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;color:var(--tx)}
.btn.neg{background:#111;color:#fff;border-color:#111}
.btn.azul{background:var(--pri);color:#fff;border-color:var(--pri);border-radius:999px;padding:13px 28px;font-size:16px}
.btn.rojo{color:var(--bad);border-color:#fecaca;background:#fff5f5}
.btn:disabled{opacity:.45;cursor:default}
.btn.redondo{width:48px;height:48px;padding:0;justify-content:center;border-radius:50%}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mut);font-size:13px}
h2{font-size:26px;font-weight:600;margin:6px 0 4px}
h3{font-size:16px;margin:22px 0 8px}
/* stepper */
.pasos{display:flex;align-items:center;gap:14px;padding:6px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.paso{display:flex;align-items:center;gap:10px;white-space:nowrap;border:0;background:none;padding:0;color:var(--mut)}
.paso b{width:30px;height:30px;border-radius:50%;border:1px solid #cfcfd4;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;color:var(--mut)}
.paso.on{color:var(--tx);font-weight:600}.paso.on b{background:#111;border-color:#111;color:#fff}
.paso.hecho b{background:#e9e9ec;border-color:#e9e9ec;color:#111}
.linea{flex:1;height:1px;background:#d4d4d8}
@media(max-width:700px){.paso span{display:none}}
/* paso 1 */
.centro{text-align:center;margin-bottom:26px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1150px;margin:0 auto}
@media(max-width:760px){.tipos{grid-template-columns:1fr}}
.tipo{display:flex;align-items:center;gap:20px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;position:relative}
.tipo:hover,.tipo.sel{border-color:#111;background:#fafafa}
.tipo svg{width:34px;height:34px;flex:none}
.tipo .t{font-size:19px}.tipo .d{color:var(--mut);margin-top:3px}
.chip{position:absolute;right:18px;top:50%;transform:translateY(-50%);background:#111;color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
/* columnas */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:34px}
@media(max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}
.cols>*{min-width:0}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.der{border-left:1px solid var(--line);padding-left:30px}
@media(max-width:980px){.der{border-left:0;padding-left:0}}
.pegajoso{position:sticky;top:80px}
.caja{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.caja.gris{background:#f4f4f6}
label.l{display:block;font-size:15px;margin:14px 0 7px}
label.l .req{color:#dc2626}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.dos{grid-template-columns:1fr}}
.ayuda{font-size:13px;color:var(--mut);margin-top:6px}
.err{font-size:13px;color:var(--bad);margin-top:6px}
.subir{border:1.5px dashed #d4d4d8;border-radius:12px;padding:22px;text-align:center;cursor:pointer;background:#fff;display:block}
.subir:hover{border-color:#111}
.subir input{display:none}
.archivo{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.archivo img{width:50px;height:50px;object-fit:contain;border-radius:8px;background:#f4f4f6}
.archivo span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:none;font-size:20px;color:var(--mut);padding:4px 8px}
.num{width:28px;height:28px;border-radius:50%;background:#e9e9ec;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.plegar{display:flex;align-items:center;gap:10px;border:0;background:none;font-weight:700;font-size:16px;padding:14px 0;width:100%;text-align:left}
.redes-sel{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px}
.rd{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.rd.on{border:2px solid #111}
.rd span{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rd svg{width:17px;height:17px}
.red-fila{display:grid;grid-template-columns:150px 1fr 36px;gap:10px;align-items:center;background:#f4f4f6;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.red-fila .n{display:flex;align-items:center;gap:8px}
.red-fila .n span{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.red-fila svg{width:15px;height:15px}
@media(max-width:600px){.red-fila{grid-template-columns:1fr 36px}.red-fila .n{grid-column:1/3}}
.pie{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:26px}
/* telefono */
.tel{width:300px;height:600px;margin:0 auto;border-radius:38px;border:9px solid #e8e8eb;box-shadow:0 0 0 1px #d4d4d8,0 20px 40px rgba(0,0,0,.08);overflow:hidden;background:#fff}
.tel>div{height:100%;overflow:auto;zoom:.82}
.tel .pg{min-height:100%}
/* paso 3 */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:16px 0 18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 0;color:var(--mut);font-size:17px;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);border-color:#111}
.tabs em{font-style:normal;font-size:11px;font-weight:700;background:#e9e9ec;border-radius:6px;padding:2px 6px;margin-left:6px;color:#444}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.pills button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 20px;font-size:16px}
.pills button.on{background:#111;color:#fff;border-color:#111}
.opciones{display:flex;gap:12px;flex-wrap:wrap}
.op{width:86px;height:86px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;padding:8px}
.op.on{border:2px solid #111;background:#fafafa}
.op svg{width:100%;height:100%}
.op.ch{width:60px;height:60px}
.marcos .op{width:96px;height:96px}
.colores{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:7px}
.sw.on{border:2px solid #111}
.sw i{display:block;width:100%;height:100%;border-radius:7px}
.hex{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:3px 3px 3px 12px;max-width:220px}
.hex input[type=text]{border:0;padding:8px 0;outline:0}
.hex input[type=color]{width:38px;height:36px;border:0}
.toggle{display:flex;align-items:center;gap:10px;margin:12px 0}
.toggle input{width:44px;height:24px;appearance:none;background:#d4d4d8;border-radius:999px;position:relative;cursor:pointer;border:0;padding:0}
.toggle input:before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
.toggle input:checked{background:#111}.toggle input:checked:before{left:22px}
.radio{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.radio{grid-template-columns:1fr}}
.rb{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;text-align:left}
.rb.on{border-color:#111}
.rb i{width:18px;height:18px;border-radius:50%;border:2px solid #9ca3af;flex:none;margin-top:2px}
.rb.on i{border:5px solid #111}
.rb small{display:block;color:var(--mut);margin-top:3px}
.vista{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.vista .qr svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.estado{font-size:13px;margin-top:10px;min-height:18px}
.estado.ok{color:var(--ok)}.estado.bad{color:var(--bad)}
.avisos{margin-top:10px;text-align:left}
.av{background:#fef3c7;border:1px solid #fcd34d;color:#78350f;font-size:13px;padding:8px 10px;border-radius:10px;margin-top:8px}
.av.info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
.rango{display:flex;align-items:center;gap:10px}.rango span{width:48px;text-align:right;font-size:13px;color:var(--mut)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#f4f4f6;border-radius:12px;padding:12px;margin-top:16px}
.res div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.res small{color:var(--mut);display:block}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#f4f4f6;border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-all;text-align:left;max-height:180px;overflow:auto}
/* mis qrs */
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:18px}
.tarj{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tarj .mini{background:#f4f4f6;border-radius:10px;padding:10px;display:flex;justify-content:center}
.tarj .mini svg{width:150px;height:150px}
.tarj b{font-size:16px}.tarj .dst{font-size:12px;color:var(--mut);word-break:break-all}
.tarj .fila .btn{padding:7px 12px;font-size:13px}
.vacio{text-align:center;padding:60px 20px;background:#fff;border:1px dashed #d4d4d8;border-radius:14px;margin-top:18px}
@media(max-width:600px){main{padding:14px}.top{padding:10px 12px;gap:8px}.marca{font-size:16px}.nav button{padding:7px 8px;font-size:13px}.op{width:66px;height:66px}.marcos .op{width:78px;height:78px}.opciones{gap:8px}.sw{width:40px;height:40px}.tabs{gap:14px}.tabs button{font-size:14.5px}.tabs em{display:none}.pills button{padding:9px 14px;font-size:14px}.tel{width:100%;max-width:300px}.tipo{padding:16px}.tipo .chip{position:static;transform:none;margin-left:auto}}
@media(max-width:980px){.p3 .der{order:-1}.p3 .vista .qr svg{max-width:240px}.p3 .der h3{display:none}.pegajoso{position:static}.der{margin-top:8px}}
@media(min-width:601px) and (max-width:980px){main{padding:20px 26px}.tipos{gap:12px}.tel{width:320px}}
@media(min-width:1600px){main{max-width:1400px}.cols{grid-template-columns:minmax(0,1fr) 420px}}
@media(hover:none){.op,.sw,.btn,.pills button,.tipo{-webkit-tap-highlight-color:transparent}}
input,select,textarea{font-size:16px}
.marca,.nav button{white-space:nowrap}
@media(max-width:600px){.p3 .vista .qr svg{max-width:200px}.p3 .vista{padding:14px}}
@media(max-width:430px){.marca span{display:none}.nav{margin-left:auto}.nav button{font-size:14px;padding:8px 10px}}
.estilos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:700px){.estilos{grid-template-columns:repeat(2,1fr)}}
.estilo{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.estilo.on{border:2px solid #111;background:#fafafa}.estilo svg{width:100%;height:auto;max-width:150px}.estilo span{font-size:13px;color:#333}
.plantillas{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 4px}
@media(max-width:700px){.plantillas{grid-template-columns:repeat(2,1fr)}}
.plantilla{border:1px solid var(--line);border-radius:16px;background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.plantilla.on{border:2px solid #111}.plantilla span{font-size:13px}
.pl-tel{width:100%;aspect-ratio:9/16;border-radius:14px;overflow:hidden;position:relative;border:1px solid #e5e5e8;background:#fff}
.pl-in{position:absolute;left:0;top:0;width:360px;transform-origin:0 0;pointer-events:none}
.datos-ed .dos{margin-bottom:8px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 18px;border-radius:10px;display:none;z-index:50;max-width:90vw}
.oculto{display:none!important}
</style>
</head>
<body>
<div class="top"><div class="marca"><i></i><span>QR Studio</span></div>
  <div class="nav"><button data-v="inicio">Mis QRs</button><button data-v="nuevo">+ Nuevo QR</button><button data-v="ajustes">Ajustes</button></div></div>
<main id="main"></main>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" async></script>
<script>
// QR en JavaScript puro (port exacto de qr.py)
const QRGen = (() => {
  const ECC = [
    [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]];
  const NB = [
    [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]];
  const NIV = { L: [0, 1], M: [1, 0], Q: [2, 3], H: [3, 2] };
  const rawMods = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };
  const dataCw = (v, i) => Math.floor(rawMods(v) / 8) - ECC[i][v] * NB[i][v];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 0xFF; };
  const divisor = d => { const r = new Array(d - 1).fill(0).concat([1]); let root = 1;
    for (let k = 0; k < d; k++) { for (let j = 0; j < r.length; j++) { r[j] = mul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; } root = mul(root, 2); } return r; };
  const rem = (data, div) => { const r = div.map(() => 0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => r[i] ^= mul(c, f)); } return r; };

  function make(text, nivel = "M") {
    const [idx, fmt] = NIV[nivel];
    const data = Array.from(new TextEncoder().encode(text));
    let ver, cb;
    for (ver = 1; ver <= 40; ver++) { cb = ver <= 9 ? 8 : 16; if (4 + cb + data.length * 8 <= dataCw(ver, idx) * 8) break; }
    if (ver > 40) throw new Error("Texto demasiado largo");
    const size = ver * 4 + 17;
    const bits = []; const add = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
    add(4, 4); add(data.length, cb); data.forEach(b => add(b, 8));
    const cap = dataCw(ver, idx) * 8;
    add(0, Math.min(4, cap - bits.length)); add(0, (8 - bits.length % 8) % 8);
    for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) add(p, 8);
    const cw = []; for (let i = 0; i < bits.length; i += 8) { let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j]; cw.push(v); }

    const nb = NB[idx][ver], el = ECC[idx][ver], total = Math.floor(rawMods(ver) / 8);
    const short = nb - total % nb, sl = Math.floor(total / nb), dv = divisor(el);
    const blocks = []; let k = 0;
    for (let i = 0; i < nb; i++) { const n = sl - el + (i < short ? 0 : 1); let d = cw.slice(k, k + n); k += n;
      const e = rem(d, dv); if (i < short) d = d.concat([0]); blocks.push(d.concat(e)); }
    const fin = [];
    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== sl - el || j >= short) fin.push(b[i]); });

    const m = [...Array(size)].map(() => Array(size).fill(false));
    const fx = [...Array(size)].map(() => Array(size).fill(false));
    const set = (x, y, v) => { m[y][x] = v; fx[y][x] = true; };
    const formato = mk => { const d = fmt << 3 | mk; let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412; const g = i => ((b >>> i) & 1) === 1;
      for (let i = 0; i < 6; i++) set(8, i, g(i)); set(8, 7, g(6)); set(8, 8, g(7)); set(7, 8, g(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, g(i)); for (let i = 0; i < 8; i++) set(size - 1 - i, 8, g(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, g(i)); set(8, size - 8, true); };

    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }

/* contexto de archivos: inline (data:) o archivos separados */
function ctxArchivos(inline, preview) {
  const mapa = new Map(), usados = new Set(), files = [];
  const EXT = { "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif", "image/svg+xml": "svg", "application/pdf": "pdf", "video/mp4": "mp4", "video/webm": "webm", "text/calendar": "ics", "text/vcard": "vcf" };
  return {
    inline, preview, files,
    asset(data, base) {
      if (!data) return "";
      if (inline) return data;
      if (mapa.has(data)) return mapa.get(data);
      const mime = (data.match(/^data:([^;,]+)/) || [])[1] || "application/octet-stream";
      let nom = `${base}.${EXT[mime] || "bin"}`, i = 2;
      while (usados.has(nom)) nom = `${base}-${i++}.${EXT[mime] || "bin"}`;
      usados.add(nom); mapa.set(data, nom); files.push([nom, dataABytes(data)]); return nom;
    }
  };
}
function ics(c, id) {
  const dt = v => (v || "").replace(/[-:]/g, "").slice(0, 13) + "00";
  const e = v => String(v || "").replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const ahora = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//QR Studio//ES", "BEGIN:VEVENT", `UID:${id}@qrstudio`, `DTSTAMP:${ahora}`, `DTSTART:${dt(c.inicio)}`, c.fin ? `DTEND:${dt(c.fin)}` : "", `SUMMARY:${e(c.titulo)}`, c.lugar ? `LOCATION:${e(c.lugar)}` : "", c.descripcion ? `DESCRIPTION:${e(c.descripcion)}` : "", c.url ? `URL:${normUrl(c.url)}` : "", "END:VEVENT", "END:VCALENDAR"].filter(Boolean).join("\r\n");
}
function vcardTexto(c) {
  const e = v => String(v || "").replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const L = ["BEGIN:VCARD", "VERSION:3.0", `N:${e(c.apellido)};${e(c.nombre)};;;`, `FN:${e([c.nombre, c.apellido].filter(Boolean).join(" "))}`];
  if (c.empresa) L.push(`ORG:${e(c.empresa)}`); if (c.cargo) L.push(`TITLE:${e(c.cargo)}`);
  if (c.celular) L.push(`TEL;TYPE=CELL:${c.celular}`); if (c.telefono) L.push(`TEL;TYPE=WORK:${c.telefono}`);
  if (c.email) L.push(`EMAIL:${c.email}`); if (c.web) L.push(`URL:${normUrl(c.web)}`);
  if (c.calle || c.ciudad || c.estado || c.cp || c.pais) L.push(`ADR;TYPE=WORK:;;${e(c.calle)};${e(c.ciudad)};${e(c.estado)};${e(c.cp)};${e(c.pais)}`);
  if (c.nota) L.push(`NOTE:${e(c.nota)}`);
  L.push("END:VCARD"); return L.join("\n");
}

/* ===================== reglas por QR ===================== */
function usaPagina(q) {
  const t = TIPOS[q.tipo];
  if (t.modo === "pagina") return true;
  if (t.modo === "opcion") return t.usaPagina(q.c) || (t.editable && t.editable(q.c) && q.editable);
  if (t.modo === "editable") return !!q.editable;
  return false;
}
const puedeEditable = q => { const t = TIPOS[q.tipo]; return t.modo === "editable" || (t.editable && t.editable(q.c)); };
const esRedireccion = q => usaPagina(q) && (TIPOS[q.tipo].modo === "editable" || (TIPOS[q.tipo].editable && TIPOS[q.tipo].editable(q.c)));
const urlPagina = (q, base) => `${String(base || "").trim().replace(/\/+$/, "")}/${q.slug}/`;
const contenidoQR = (q, base) => usaPagina(q) ? urlPagina(q, base) : TIPOS[q.tipo].datos(q.c);

/* ===================== cifrado (contrasena real) ===================== */
async function cifrar(texto, clave) {
  const enc = new TextEncoder(), salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey("raw", enc.encode(clave), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(texto)));
  return { s: b64(salt), i: b64(iv), c: b64(ct) };
}

/* ===================== ZIP (sin librerias) ===================== */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = t[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }; })();
function zip(archivos) {
  const enc = new TextEncoder(), partes = [], central = []; let off = 0;
  for (const [nombre, datos] of archivos) {
    const nb = enc.encode(nombre), d = typeof datos === "string" ? enc.encode(datos) : datos, crc = CRC(d);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint32(14, crc, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, nb.length, true);
    partes.push(new Uint8Array(h.buffer), nb, d);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint32(16, crc, true); c.setUint32(20, d.length, true); c.setUint32(24, d.length, true); c.setUint16(28, nb.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nb); off += 30 + nb.length + d.length;
  }
  const tam = central.reduce((a, b) => a + b.length, 0), f = new DataView(new ArrayBuffer(22));
  f.setUint32(0, 0x06054b50, true); f.setUint16(8, archivos.length, true); f.setUint16(10, archivos.length, true); f.setUint32(12, tam, true); f.setUint32(16, off, true);

};

function leerArchivo(f) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); }); }
async function procesarImagen(f, max = 900, foto = false) {
  const url = await leerArchivo(f); if (/svg/.test(f.type)) return url;
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("No se pudo leer la imagen")); i.src = url; });
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return foto ? c.toDataURL("image/jpeg", .86) : c.toDataURL("image/png");
}
function inputArchivo(acc, alCargar, multiple) {
  const lab = el("label", "subir", `${svgIco("descarga", "#111")}<div style="margin-top:8px">Haz clic aquí para subir o arrastra y suelta tu archivo</div><div class="muted">Tamaño máx.: 5 MB • ${esc(acc.includes("pdf") ? "PDF" : acc.includes("video") ? "MP4, WEBM" : "PNG, JPG, WEBP")}</div><input type="file" accept="${acc}"${multiple ? " multiple" : ""}>`);
  lab.querySelector("svg").style.cssText = "width:22px;height:22px;transform:rotate(180deg)";
  const inp = lab.querySelector("input");
  const tomar = fs => { if (fs && fs.length) alCargar([...fs]); };
  inp.onchange = () => tomar(inp.files);
  lab.ondragover = e => { e.preventDefault(); lab.style.borderColor = "#111"; };
  lab.ondragleave = () => lab.style.borderColor = "";
  lab.ondrop = e => { e.preventDefault(); lab.style.borderColor = ""; tomar(e.dataTransfer.files); };
  return lab;
}

/* quita el fondo blanco que toca los bordes de la imagen (logo sobre blanco) */
async function quitarFondo(src, forzar) {
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
  const c = document.createElement("canvas"); c.width = img.width; c.height = img.height; const x = c.getContext("2d"); x.drawImage(img, 0, 0);
  const W = c.width, H = c.height, im = x.getImageData(0, 0, W, H), d = im.data;
  const blanco = i => d[i + 3] > 10 && d[i] + d[i + 1] + d[i + 2] >= 695 && Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2]) < 28;
  let borde = 0, total = 0;
  for (let px = 0; px < W; px++) for (const py of [0, H - 1]) { total++; const i = (py * W + px) * 4; if (blanco(i) || d[i + 3] < 10) borde++; }
  for (let py = 0; py < H; py++) for (const px of [0, W - 1]) { total++; const i = (py * W + px) * 4; if (blanco(i) || d[i + 3] < 10) borde++; }
  if (!forzar && borde / total < .6) return null;            // no parece un logo sobre blanco
  const vis = new Uint8Array(W * H), pila = [];
  const sem = (px, py) => { const k = py * W + px; if (!vis[k] && blanco(k * 4)) { vis[k] = 1; pila.push(k); } };
  for (let px = 0; px < W; px++) { sem(px, 0); sem(px, H - 1); }
  for (let py = 0; py < H; py++) { sem(0, py); sem(W - 1, py); }
  while (pila.length) { const k = pila.pop(), px = k % W, py = (k / W) | 0; d[k * 4 + 3] = 0;
    if (px > 0) sem(px - 1, py); if (px < W - 1) sem(px + 1, py); if (py > 0) sem(px, py - 1); if (py < H - 1) sem(px, py + 1); }
  // suavizar el borde: pixeles claros pegados a lo transparente quedan semitransparentes
  for (let k = 0; k < W * H; k++) { if (vis[k]) continue; const px = k % W, py = (k / W) | 0;
    if ((px > 0 && vis[k - 1]) || (px < W - 1 && vis[k + 1]) || (py > 0 && vis[k - W]) || (py < H - 1 && vis[k + W])) { const i = k * 4, l = (d[i] + d[i + 1] + d[i + 2]) / 3; if (l > 170) d[i + 3] = Math.round(d[i + 3] * Math.max(0, (255 - l) / 85)); } }
  x.putImageData(im, 0, 0);
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) if (d[(py * W + px) * 4 + 3] > 12) { if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; }
  if (x1 < 0) return null;
  const o = document.createElement("canvas"); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1; o.getContext("2d").drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return o.toDataURL("image/png");
}

/* dice si la pagina de un QR ya esta publicada (solo se puede revisar en el mismo sitio) */
async function estadoPublicacion(q, caja) {

  try {

    else caja.innerHTML = `<div class="av" style="margin:0">⚠ <b>Falta publicar su página.</b> Si escaneas este QR verás “todavía no tiene página”. Usa <b>Exportar todo (ZIP)</b> y sube la carpeta <b>q</b> a GitHub.</div>`;

function slugLibre(s, yo) { s = slugify(s) || "qr"; let k = s, i = 2; while (DB.qrs.some(x => x.slug === k && x.id !== yo)) k = `${s}-${i++}`; return k; }

  const w = el("div");
  const req = typeof f.req === "function" ? f.req(obj) : f.req;
  if (f.plegable) {
    const ab = V.abiertos[f.k] ?? !!(Array.isArray(obj[f.k]) ? obj[f.k].length : obj[f.k]);
    const b = el("button", "plegar", `<span style="font-size:20px">${ab ? "−" : "+"}</span>${esc(f.l)}${ab ? '<span class="muted" style="margin-left:auto;font-weight:400">Ocultar</span>' : ""}`);
    b.type = "button"; b.onclick = () => { V.abiertos[f.k] = !ab; rehacer(); }; w.append(b);

  toast("Preparando ZIP…");
  const A = [], R = "qr-studio-export/", usados = new Set();
  const lee = ["QR STUDIO - paquete exportado", "", "q/         -> paginas de tus QR. En GitHub: Add file > Upload files y arrastra la carpeta q completa.", "              Deben quedar en: " + DB.base_url + "/", "qrs/       -> codigos QR en PNG (imprimir) y SVG (imprenta). No hace falta subirlos.", "respaldo.json -> para volver a abrir todo en QR Studio (Importar respaldo)", "", "Codigos:"];
  for (const q of lista) {
    let n = nombreArchivo(q), i = 2; while (usados.has(n)) n = nombreArchivo(q) + "-" + i++; usados.add(n);
    const r = svgQR(contenidoQR(q, DB.base_url), q.d);
    const c = await canvasDe(r.svg, 1024, q.d.transparente && q.d.modo !== "marca" ? null : "#ffffff");
    A.push([`${R}qrs/${n}.png`, new Uint8Array(await (await pngBlob(c)).arrayBuffer())], [`${R}qrs/${n}.svg`, r.svg]);
    if (usaPagina(q)) {
      const p = await paginaFinal(q);
      A.push([`${R}q/${q.slug}/index.html`, p.html]); p.files.forEach(([f, b]) => A.push([`${R}q/${q.slug}/${f}`, b]));
      lee.push(`- ${q.nombre || TIPOS[q.tipo].n}: ${urlPagina(q, DB.base_url)}${q.seg.activa ? " (con contrasena)" : ""}`);
    } else lee.push(`- ${q.nombre || TIPOS[q.tipo].n}: datos dentro del QR (no se publica nada)`);
  }
  A.push([`${R}respaldo.json`, JSON.stringify({ app: "qr-studio", version: 3, base_url: DB.base_url, qrs: lista })], [`${R}LEEME.txt`, lee.join("\r\n")]);
  bajar(nombreZip, zip(A));
}
const exportarTodo = () => DB.qrs.length ? exportar(DB.qrs, "qr-studio-todo.zip") : toast("No hay QRs para exportar");

/* ===================== inicio ===================== */
(async () => {
  await ALM.abrir();
  const g = await ALM.leer();
  if (g && Array.isArray(g.qrs)) DB = g; else { DB.qrs = ejemplos(); guardar(); }
  const sitio = baseDelSitio();
  if (sitio && /tuempresa\.com/.test(DB.base_url) && /(github\.io|localhost|127\.0\.0\.1)$/.test(location.hostname)) { DB.base_url = sitio; guardar(); }
  pintar();
})();
window.__qr = { get DB() { return DB; }, svgQR, canvasDe, paginaFinal, contenidoQR, usaPagina, TIPOS, nuevoQR, errores, zip, exportar, ir, V };
